name: release

# Every push publishes a release with InspectGive.zip. Pushes to main become the
# latest release, which csfleet's inspectgive.toml (github_release, latest) picks
# up on its next provision. Other branches overwrite a prerelease tagged with the
# branch name, so a manifest can pin `version = "<branch>"` to try them without
# touching latest.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          ./build.sh
          dotnet publish -c Release -o out/InspectGive
          cd out && zip -r InspectGive.zip InspectGive

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = main ]; then
            gh release create "build-${{ github.run_number }}" out/InspectGive.zip \
              --target "${{ github.sha }}" \
              --title "build ${{ github.run_number }}" \
              --notes "Built from ${{ github.sha }}" \
              --latest
          else
            gh release delete "$BRANCH" --cleanup-tag --yes || true
            gh release create "$BRANCH" out/InspectGive.zip \
              --target "${{ github.sha }}" \
              --title "$BRANCH (branch build)" \
              --notes "Built from ${{ github.sha }} on $BRANCH" \
              --prerelease --latest=false
          fi
